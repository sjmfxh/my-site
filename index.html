<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kazehana</title>
  <meta name="description" content="Kazehana 的个人主页">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">

    <!-- 头像是纯 CSS 画的，改字母就行；想换成图片见下面注释 -->
    <div class="avatar" aria-hidden="true">K</div>

    <!-- ★ 改这里：你的名字 -->
    <h1>Kazehana</h1>

    <!-- ★ 改这里：一句话介绍自己 -->
    <p class="tagline">大一 · 信息管理与信息系统 · 在学 C++</p>

    <!-- ★ 改这里：想多说两句就写在这 -->
    <p class="bio">
      这里写一段关于你自己的话。可以是什么地方的人、平时喜欢干什么、
      现在在折腾什么。两三句就够，别写成简历。
    </p>

    <!-- ★ 改这里：想放什么链接就放什么，不要的直接删掉整行 -->
    <ul class="links">
      <li><a href="https://github.com/">GitHub</a></li>
      <li><a href="#">作品</a></li>
      <li><a href="#">联系方式</a></li>
    </ul>

    <footer>
      <span>© 2026 Kazehana</span>
    </footer>

  </main>

</body>
</html>
